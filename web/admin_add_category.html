<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Kebda Zaman - Add Category</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@600;700;800&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#e5e2e3",

                        "on-primary-fixed-variant": "#832600",
                        "on-tertiary-fixed": "#002204",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#1b1b1c",
                        "primary": "#ab3500",
                        "on-surface": "#1b1c1a",
                        "surface": "#faf9f5",
                        "on-tertiary-container": "#003a0b",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#faf9f5",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e3e2df",
                        "secondary-fixed-dim": "#c8c6c7",
                        "primary-fixed": "#ffdbd0",
                        "surface-container": "#efeeea",
                        "secondary-container": "#e2dfe0",
                        "primary-fixed-dim": "#ffb59d",
                        "on-surface-variant": "#594139",
                        "surface-container-low": "#f4f4f0",
                        "tertiary-fixed": "#94f990",
                        "surface-container-high": "#e9e8e4",
                        "inverse-on-surface": "#f2f1ed",
                        "on-primary-fixed": "#390c00",
                        "tertiary-fixed-dim": "#78dc77",
                        "tertiary-container": "#4aad4e",
                        "outline-variant": "#e1bfb5",
                        "on-secondary-container": "#636263",
                        "inverse-surface": "#2f312e",
                        "outline": "#8d7168",
                        "error": "#ba1a1a",
                        "on-primary-container": "#5f1900",
                        "tertiary": "#006e1c",
                        "on-tertiary-fixed-variant": "#005313",
                        "surface-dim": "#dbdad6",
                        "on-error": "#ffffff",
                        "surface-tint": "#ab3500",
                        "background": "#faf9f5",
                        "inverse-primary": "#ffb59d",
                        "on-error-container": "#93000a",
                        "on-background": "#1b1c1a",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "lg": "24px",
                        "xl": "32px",
                        "sm": "8px",
                        "gutter": "16px",
                        "container-padding": "20px",
                        "base": "4px",
                        "md": "16px",
                        "xxl": "48px"

                    "fontFamily": {
                        "label-md": ["Inter"],
                        "h1": ["Montserrat"],

                        "display-mobile": ["Montserrat"],
                        "caption": ["Inter"],
                        "display": ["Montserrat"],

                    "fontSize": {

            },
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #ff6b35;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #ff6b35;
        }
    </style>
</head>
<body class="bg-surface font-body-lg text-on-surface min-h-screen pb-32">
<header class="sticky top-0 z-50 bg-surface-bright/90 backdrop-blur-md px-container-padding h-16 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-4">
<a class="text-on-surface p-2 hover:bg-surface-container-low rounded-full" href="admin_menu.html">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<h1 class="font-h1 text-h1-mobile text-on-surface">Add Category</h1>
</div>
</header>
<main class="px-container-padding py-lg max-w-md mx-auto space-y-lg">
<section class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Category Visual</label>
<div class="relative group h-44 w-full rounded-xl border-2 border-dashed border-outline-variant bg-surface-container-lowest flex flex-col items-center justify-center">
<div class="w-14 h-14 rounded-full bg-primary-fixed flex items-center justify-center text-primary-container shadow-md mb-2">
<span class="material-symbols-outlined text-3xl">add_a_photo</span>
</div>
<p class="font-label-md text-label-md text-primary">Upload Thumbnail</p>
<p class="font-caption text-caption text-secondary">Recommended: 512x512 PNG</p>
</div>
</section>
<div class="bg-surface-container-lowest p-lg rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] space-y-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Category Name</label>
<input class="w-full h-12 px-md rounded-lg border border-outline-variant bg-surface-container-lowest" id="category_name" placeholder="e.g. Burgers" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Internal Notes</label>
<textarea class="w-full p-md rounded-lg border border-outline-variant bg-surface-container-lowest" placeholder="Notes for kitchen and staff..." rows="3"></textarea>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Display Order</label>
<input class="w-full h-12 px-md rounded-lg border border-outline-variant bg-surface-container-lowest" type="number" value="1"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Visibility</label>
<div class="h-12 flex items-center justify-between px-md bg-surface-container rounded-lg">
<span class="font-label-md text-label-md text-on-surface-variant">Active</span>
<input checked="" type="checkbox"/>
</div>
</div>
</div>
</div>
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Live Preview</label>
<div class="bg-surface-container-high rounded-xl p-md flex items-center gap-md border border-outline-variant/30">
<div class="w-14 h-14 rounded-lg bg-surface-container-lowest flex items-center justify-center">
<span class="material-symbols-outlined text-secondary">restaurant</span>
</div>
<div class="flex-1">
<p class="font-h2 text-h2 text-on-surface" id="preview_name">Category Name</p>
<p class="font-caption text-caption text-primary">In Menu #1</p>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</div>
</div>
</main>
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-surface/80 backdrop-blur-xl z-40">
<button class="w-full bg-primary-container text-on-tertiary font-label-md text-label-md h-14 rounded-full shadow-lg flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add_circle</span>
Create Category
</button>
</div>
<script>
        const nameInput = document.getElementById('category_name');
        const previewName = document.getElementById('preview_name');
        nameInput.addEventListener('input', (e) => {
            previewName.textContent = e.target.value || 'Category Name';
        });
    </script>
</body>
</html>
