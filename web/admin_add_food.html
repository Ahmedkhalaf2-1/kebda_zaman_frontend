<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>

                    "secondary": "#5f5e5f",
                    "on-background": "#1b1c1a",
                    "primary-fixed-dim": "#ffb59d",
                    "on-error-container": "#93000a",
                    "secondary-container": "#e2dfe0",

<style>
        body {
            background-color: #FDFCF8;
            color: #1b1c1a;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-card {
            box-shadow: 0 4px 20px rgba(171, 53, 0, 0.05);
        }
    </style>

<body class="font-body-lg text-body-lg min-h-screen pb-32">
<header class="bg-surface-bright sticky top-0 z-50 flex justify-between items-center px-container-padding h-16 w-full shadow-sm">
<div class="flex items-center gap-4">
<a class="text-primary" href="admin_menu.html">
<span class="material-symbols-outlined text-[28px]">arrow_back</span>
</a>
<h1 class="font-h1 text-h1-mobile font-bold text-primary">Add New Item</h1>
</div>
</header>
<main class="max-w-3xl mx-auto px-container-padding pt-lg space-y-lg">
<section class="relative group">
<div class="w-full h-44 rounded-xl border-2 border-dashed border-outline-variant bg-surface-container-low flex flex-col items-center justify-center p-md">
<span class="material-symbols-outlined text-primary text-[40px] mb-sm">cloud_upload</span>
<p class="font-h2 text-h2 text-on-surface">Upload Food Image</p>
<p class="font-caption text-caption text-on-surface-variant mt-xs">High-resolution JPG or PNG</p>
</div>
</section>
<section class="bg-surface-container-lowest p-lg rounded-xl form-card space-y-md">
<div class="flex items-center gap-2 mb-sm">
<span class="material-symbols-outlined text-primary">info</span>
<h3 class="font-h2 text-h2 text-on-surface">Basic Information</h3>
</div>
<div class="space-y-gutter">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Product Name</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg p-md font-body-lg" placeholder="e.g., Kebda Iskandarani Sandwich" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Description</label>
<textarea class="w-full bg-surface-bright border border-outline-variant rounded-lg p-md font-body-lg" placeholder="Describe the ingredients..." rows="3"></textarea>
</div>
<div class="grid grid-cols-2 gap-gutter">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Category</label>
<select class="w-full bg-surface-bright border border-outline-variant rounded-lg p-md font-body-lg">
<option>Main Course</option>
<option>Appetizers</option>
<option>Desserts</option>
<option>Beverages</option>
</select>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Base Price (EGP)</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg p-md font-body-lg" placeholder="0.00" type="number"/>
</div>
</div>
</div>
</section>
</main>
<footer class="fixed bottom-0 left-0 right-0 p-container-padding bg-surface-container-lowest/80 backdrop-blur-md shadow-[0_-8px_32px_rgba(0,0,0,0.08)] z-[60]">
<div class="max-w-3xl mx-auto flex gap-md">
<a class="flex-[1] text-center py-md bg-surface-container-high text-secondary rounded-xl font-bold" href="admin_menu.html">Discard</a>
<button class="flex-[2] py-md bg-primary text-on-primary rounded-full font-bold shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
Save Product
</button>
</div>
</footer>
</body>
</html>
