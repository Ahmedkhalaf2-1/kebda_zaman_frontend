<!DOCTYPE html>

<head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .custom-switch:checked + .switch-bg {
            background-color: #006e1c;
        }
        .custom-switch:checked + .switch-bg .switch-dot {
            transform: translateX(1.25rem);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-lg antialiased min-h-screen">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-container-padding h-16 w-full z-50 bg-surface-bright dark:bg-surface-dim shadow-sm sticky top-0">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white shadow-sm">
<span class="material-symbols-outlined text-xl">restaurant</span>
</div>
<h1 class="font-h1 text-h1-mobile font-bold text-primary">Kebda Zaman</h1>
</div>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors duration-200 active:scale-95">
<span class="material-symbols-outlined text-primary">search</span>
</button>
</div>
</header>
<main class="pb-32">
<!-- Category Tabs -->
<section class="mt-md px-container-padding">
<div class="flex gap-sm overflow-x-auto hide-scrollbar py-2" id="categories-list">
<button class="px-lg py-sm rounded-full bg-primary text-on-primary font-label-md text-label-md whitespace-nowrap transition-all duration-200">All Items</button>
</div>
</section>
<!-- Product List -->
<section class="mt-lg px-container-padding flex flex-col gap-md" id="product-list-container">
<div class="bg-surface-container-lowest p-8 rounded-xl text-center text-secondary border border-outline-variant/30">
<span class="material-symbols-outlined text-5xl block mb-2 opacity-40">restaurant_menu</span>
No food items found in menu. Click + Add Item to create one.
</div>
</section>
</main>
<!-- FAB -->
<button class="fixed bottom-24 right-6 w-14 h-14 bg-primary text-on-primary rounded-2xl shadow-xl flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95 z-40 group">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface dark:bg-inverse-surface shadow-[0_-4px_20px_rgba(0,0,0,0.05)] border-t border-outline-variant dark:border-outline">
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high transition-transform duration-150 active:scale-90" href="admin_dashboard.html">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-md text-label-md mt-1">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high transition-transform duration-150 active:scale-90" href="admin_orders.html">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-label-md text-label-md mt-1">Orders</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim bg-primary-container/10 rounded-xl px-3 py-1 transition-transform duration-150 active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">restaurant_menu</span>
<span class="font-label-md text-label-md mt-1">Menu</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high transition-transform duration-150 active:scale-90" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-md text-label-md mt-1">Settings</span>
</a>
</nav>

</html>
