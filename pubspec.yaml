name: kebda_zaman
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+3

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  # riverpod_annotation removed: `router.dart`'s `router()` was the only
  # `@riverpod`-annotated provider in the app; it's now a manually declared
  # `Provider.autoDispose` (see router.dart) since riverpod_generator can't
  # coexist with the freezed 4.x bump below (see that comment) without also
  # forcing a breaking riverpod/flutter_riverpod 3.x upgrade.
  # Bumped from ^2.4.1: the installed toolchain here is Flutter 3.47.1 / Dart
  # 3.13.1 (see the local_auth pin below for the same class of issue) — the
  # analyzer versions resolvable under freezed_annotation/freezed 2.x cap out
  # at analyzer <8.0.0, which crashes in build_runner (`Missing
  # implementation of visitDotShorthandPropertyAccess`) on this SDK's own
  # "dot shorthand" syntax. freezed 4.x requires exactly this major.
  freezed_annotation: ^3.1.0
  # Bumped from ^4.8.1: json_serializable 6.14.1 (pulled in by the freezed
  # 4.x bump above) requires json_annotation >=4.12.0 — already what
  # resolves in practice, this just makes the constraint honest.
  json_annotation: ^4.12.0
  cached_network_image: ^3.4.1
  uuid: ^4.6.0
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  easy_localization: ^3.0.7
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^17.1.2
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  # Pinned to 2.3.0, not the 3.x line: the installed Flutter/Dart toolchain
  # here is Dart 3.8.1, and local_auth 3.0.0+ requires Dart 3.9+. 2.3.0
  # (SDK constraint ^3.2.3) is the latest version compatible with this
  # project's toolchain and exposes the same authenticate()/BiometricType API
  # used here.
  local_auth: ^2.3.0
  local_auth_android: ^1.0.52
  local_auth_darwin: ^1.6.0
  google_maps_flutter: ^2.9.0
  google_maps_flutter_android: ^2.18.3
  google_maps_flutter_platform_interface: ^2.14.1
  geolocator: ^13.0.1
  # Android-only: geolocator's own foreground-notification option explicitly
  # does not implement a real foreground Service (per its own doc comment on
  # `ForegroundNotificationConfig`) — it only raises process priority, so
  # Android can still kill the activity while backgrounded/screen-locked.
  # flutter_foreground_task (MIT, actively maintained) is the smallest
  # addition that runs a genuine Android foreground Service driven entirely
  # from Dart (no native Kotlin/Java to write) for the driver app's
  # location-upload loop while a delivery is active. iOS needs no equivalent
  # package: geolocator_apple's own `allowBackgroundLocationUpdates` +
  # `UIBackgroundModes: [location]` already gives genuine OS-level background
  # delivery for "Always"-authorized apps — a first-party Apple capability.
  flutter_foreground_task: ^11.0.3
  geocoding: ^3.0.0
  url_launcher: ^6.3.1
  lottie: ^3.1.2
  moyasar: ^3.0.4
  webview_flutter: ^4.13.0
  google_nav_bar: ^5.0.7
  home_widget: ^0.9.2+1
  # Admin new-order alert bell (this feature only) — MIT-licensed, actively
  # maintained, supports Android/iOS/web/desktop from one API. No other
  # audio-playback package exists in this project; this is the sole
  # dependency added for it.
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1
  build_runner: ^2.4.9
  # riverpod_generator removed: its 2.x line hard-caps `analyzer` at <8.0.0
  # (transitively, via `analyzer: ^7.0.0`), which is incompatible with the
  # analyzer >=13.0.0 that freezed 4.x (bumped below) requires — pub cannot
  # solve both simultaneously. riverpod_generator 4.x would resolve, but it
  # requires `riverpod: 3.4.3`/`flutter_riverpod` 3.x, a breaking rewrite of
  # the state-management layer used throughout this app — far outside the
  # scope of a codegen-toolchain fix. The only `@riverpod`-annotated function
  # in this codebase is `router.dart`'s `router()`, whose already-committed
  # `router.g.dart` is untouched by this task and needs no regeneration.
  freezed: ^4.0.1
  json_serializable: ^6.7.1
  flutter_secure_storage_platform_interface: ^2.0.1
  change_app_package_name: ^1.5.0


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Force CocoaPods-only iOS/macOS dependency integration. Some plugins used
  # here (flutter_local_notifications, google_maps_flutter_ios) don't support
  # Swift Package Manager yet, and this project's Xcode target isn't wired
  # for SPM package references, so mixing the two leaves SPM-capable plugins
  # (e.g. firebase_auth) unlinked, causing "Module 'X' not found" in Xcode.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/mock/
    - assets/photos/
    - assets/lottie/
    - assets/images/
    - assets/sounds/order_bell.wav
    - assets/translations/en.json
    - assets/translations/ar.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Locale-based type system: Alexandria for Arabic, Plus Jakarta Sans for
  # English (see lib/app.dart ThemeData). Both are OFL-licensed and
  # distributed upstream as single variable fonts (see the -OFL.txt files
  # next to each asset); each weight below maps to the same file so Flutter
  # selects the correct variation. Readex Pro is kept registered but is no
  # longer the active default — see lib/core/theme/kz_design_system.dart.
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Variable.ttf
        - asset: assets/fonts/Alexandria-Variable.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-Variable.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-Variable.ttf
          weight: 700
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 700
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/ReadexPro-Variable.ttf
        - asset: assets/fonts/ReadexPro-Variable.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-Variable.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Variable.ttf
          weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
